<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHMV 100 Anos · Wireframes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EEE6;--side:#ECE6DB;--stage:#D8D2C6;--line:#C4BCAD;--ink:#34312C;--mid:#65605A;--btn:#4A4640;--paper:#FAF8F3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:304px minmax(0,1fr);overflow:hidden}
button{font-family:inherit;color:inherit}

#side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--line)}
#brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
#brand img{width:210px;max-width:100%;height:auto;display:block}
#brand p{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mid);line-height:1.5}
#thumbs{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 28px}
.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mid);margin:22px 0 10px}
.thumb{display:block;width:100%;padding:0;margin:0 0 16px;border:0;background:none;text-align:left;cursor:pointer}
.frame{border:2px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.thumb:hover .frame{border-color:#8a8378}
.thumb:focus-visible{outline:none}
.thumb:focus-visible .frame{border-color:var(--ink);box-shadow:0 0 0 3px rgba(74,70,64,.35)}
.thumb[aria-current="page"] .frame{border-color:var(--ink);box-shadow:0 0 0 3px rgba(74,70,64,.18)}
.in{position:relative;width:100%;aspect-ratio:1440/900;overflow:hidden;background:var(--bg)}
.in iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none;background:var(--bg)}
.cap{display:flex;gap:10px;align-items:baseline;margin-top:8px;font-size:13px;line-height:1.3}
.cap .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mid);flex:0 0 22px}
.cap .t{font-weight:500}
.thumb[aria-current="page"] .cap .t{font-weight:700}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px 0 24px;background:var(--paper);border-bottom:1px solid var(--line)}
#ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
#ttl b{font-family:'Newsreader',Georgia,serif;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mid);white-space:nowrap}
#ctl{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding:0 12px;border:1.5px solid var(--btn);border-radius:6px;background:var(--paper);font-size:13px;font-weight:700;cursor:pointer}
.btn:hover:not(:disabled){background:var(--btn);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid rgba(74,70,64,.35);outline-offset:2px}
.seg{display:flex;border:1.5px solid var(--btn);border-radius:6px;overflow:hidden}
.seg button{height:33px;padding:0 12px;border:0;background:var(--paper);font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--paper)}
#cnt{font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
#hint{font-size:12px;color:var(--mid)}

#stage{flex:1;min-height:0;overflow:auto;background:var(--stage);padding:24px}
#sheet{position:relative;margin:0 auto;background:var(--bg);box-shadow:0 1px 3px rgba(52,49,44,.18),0 12px 32px rgba(52,49,44,.14);border-radius:4px;overflow:hidden}
#page{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;background:var(--bg)}

@media (max-width:1100px){#hint{display:none}}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #side{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}
  #brand{display:none}
  #thumbs{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:12px 16px}
  .grp{display:none}
  .thumb{flex:0 0 190px;width:190px;margin:0}
  #bar{padding:0 12px}
  #ttl span{display:none}
  .seg{display:none}
  #stage{padding:12px}
}
</style>
</head>
<body>

<aside id="side" aria-label="Telas do site">
<div id="brand">
<img id="brandLogo" alt="Hospital Moinhos de Vento | 100 anos">
<p>Wireframes · Proposta comercial<br>Versão desktop</p>
</div>
<nav id="thumbs"></nav>
</aside>

<main id="main">
<header id="bar">
<div id="ttl"><b id="ttlText"></b><span id="ttlGrp"></span></div>
<div id="ctl">
<span id="hint">Use ← → para navegar</span>
<div class="seg" role="group" aria-label="Zoom">
<button id="zFit" type="button" aria-pressed="true">Ajustar</button>
<button id="z100" type="button" aria-pressed="false">100%</button>
</div>
<button id="prev" class="btn" type="button" aria-label="Tela anterior">←</button>
<span id="cnt" aria-live="polite"></span>
<button id="next" class="btn" type="button" aria-label="Próxima tela">→</button>
</div>
</header>
<div id="stage">
<div id="sheet"><iframe id="page" title="Tela do wireframe"></iframe></div>
</div>
</main>

  if (inner.querySelector('iframe')) return;
  var f = document.createElement('iframe');
  f.setAttribute('tabindex', '-1');
  f.setAttribute('aria-hidden', 'true');
  f.setAttribute('title', '');
  f.srcdoc = srcFor(PAGES[i]);
  inner.appendChild(f);
  f.style.transform = 'scale(' + (inner.clientWidth / W) + ')';
}
if ('IntersectionObserver' in window) {
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) {
        var i = thumbBtns.indexOf(e.target);
        mountThumb(e.target, i);
        io.unobserve(e.target);
      }
    });
  }, {root: thumbsEl, rootMargin: '600px 0px'});
  thumbBtns.forEach(function(b){ io.observe(b); });
} else {
  thumbBtns.forEach(mountThumb);
}

/* ---------- main page ---------- */
function layout(){
  var avail = stage.clientWidth - 48;
  if (stage.clientWidth <= 820) avail = stage.clientWidth - 24;
  scale = mode === 'fit' ? Math.min(1, Math.max(avail, 280) / W) : 1;
  sheet.style.width = (W * scale) + 'px';
  sheet.style.height = (pageH * scale) + 'px';
  frame.style.height = pageH + 'px';
  frame.style.transform = 'scale(' + scale + ')';
}
function measure(){
  var d = frame.contentDocument;
  if (!d || !d.documentElement) return;
  frame.style.height = '1px';
  var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0, 200);
  pageH = h;
  layout();
}
function anchor(d, id){
  var el = id ? d.getElementById(id) : null;
  if (!el) return;
  var y = el.getBoundingClientRect().top;
  stage.scrollTo({top: Math.max(0, sheet.offsetTop + y * scale - 24), behavior: 'smooth'});
}
function keyHandler(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var t = e.target;
  var tag = t && t.tagName ? t.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'ArrowRight') { go(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
}
function bind(d){
  d.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    e.preventDefault();
    var h = a.getAttribute('href') || '';
    if (h.charAt(0) === '#') { anchor(d, h.slice(1)); return; }
    var m = h.match(/^([A-Za-z0-9_-]+)\.dc\.html/);
    if (m && FILES[m[1]] !== undefined) go(FILES[m[1]]);
  }, true);
  d.addEventListener('submit', function(e){ e.preventDefault(); }, true);
  d.addEventListener('keydown', keyHandler, true);
}
frame.addEventListener('load', function(){
  var d = frame.contentDocument;
  if (!d || !d.documentElement) return;
  bind(d);
  measure();
  setTimeout(measure, 250);
  setTimeout(measure, 900);
  setTimeout(measure, 2200);
  if (d.fonts && d.fonts.ready) d.fonts.ready.then(measure);
});

function go(i){
  if (i < 0 || i >= PAGES.length) return;
  var p = PAGES[i];
  cur = i;
  thumbBtns.forEach(function(b, k){
    if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  ttlText.textContent = p.num + ' · ' + p.title;
  ttlGrp.textContent = p.group;
  cnt.textContent = (i + 1) + ' / ' + PAGES.length;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === PAGES.length - 1;
  document.title = p.num + ' · ' + p.title + ' · AHMV 100 Anos';
  pageH = TH;
  layout();
  frame.srcdoc = srcFor(p);
  stage.scrollTop = 0;
  stage.scrollLeft = 0;
  thumbBtns[i].scrollIntoView({block: 'nearest', inline: 'nearest'});
  var want = '#/' + p.id;
  if (location.hash !== want) {
    try { history.pushState(null, '', want); } catch (e) { location.hash = want; }
  }
}

function fromHash(){
  var id = (location.hash || '').replace(/^#\/?/, '');
  for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) return i;
  return 0;
}

prevBtn.addEventListener('click', function(){ go(cur - 1); });
nextBtn.addEventListener('click', function(){ go(cur + 1); });
function setMode(m){
  mode = m;
  zFit.setAttribute('aria-pressed', m === 'fit');
  z100.setAttribute('aria-pressed', m === '100');
  layout();
}
zFit.addEventListener('click', function(){ setMode('fit'); });
z100.addEventListener('click', function(){ setMode('100'); });
document.addEventListener('keydown', keyHandler);
window.addEventListener('popstate', function(){ var i = fromHash(); if (i !== cur) go(i); });
window.addEventListener('hashchange', function(){ var i = fromHash(); if (i !== cur) go(i); });
if (window.ResizeObserver) {
  new ResizeObserver(function(){ layout(); layoutThumbs(); }).observe(stage);
  new ResizeObserver(layoutThumbs).observe(thumbsEl);
} else {
  window.addEventListener('resize', function(){ layout(); layoutThumbs(); });
}

go(fromHash());
})();
</script>
</body>
</html>
