class DCLogic{constructor(props){this.props=props||{};this.state={};}
  setState(p){Object.assign(this.state,p);if(this.__root)mount();}}
const C={};
function lookup(path,scope){path=String(path).trim();if(path==='true')return true;if(path==='false')return false;
  if(/^-?\d+(\.\d+)?$/.test(path))return Number(path);let v=scope;for(const p of path.split('.')){if(v==null)return undefined;v=v[p];}return v;}
const WHOLE=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function interp(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=lookup(p,scope);return v==null?'':String(v);});}
function attrVal(str,scope){const m=WHOLE.exec(str);return m?lookup(m[1],scope):interp(str,scope);}
function camel(s){return s.replace(/-([a-z])/g,(m,c)=>c.toUpperCase());}
function renderChildren(src,scope,dst){
  for(const n of Array.from(src.childNodes)){
    if(n.nodeType===3){dst.appendChild(document.createTextNode(interp(n.textContent,scope)));continue;}
    if(n.nodeType!==1)continue;
    const tag=n.localName;
    if(tag==='sc-if'){if(attrVal(n.getAttribute('value')||'',scope))renderChildren(n,scope,dst);continue;}
    if(tag==='sc-for'){const list=attrVal(n.getAttribute('list')||'',scope)||[];const as=n.getAttribute('as');
      list.forEach((it,i)=>renderChildren(n,Object.assign({},scope,{[as]:it,$index:i}),dst));continue;}
    if(tag==='dc-import'){const props={};for(const a of Array.from(n.attributes)){
        if(a.name==='name'||a.name.startsWith('hint-'))continue;props[camel(a.name)]=attrVal(a.value,scope);}
      dst.appendChild(instantiate(n.getAttribute('name'),props));continue;}
    if(tag==='helmet')continue;
    const el=document.createElementNS(n.namespaceURI,n.localName);
    for(const a of Array.from(n.attributes)){
      if(/^on/.test(a.name)){const fn=attrVal(a.value,scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2),fn);continue;}
      const v=attrVal(a.value,scope);if(v===false||v==null)continue;el.setAttribute(a.name,v===true?'':String(v));}
    renderChildren(n,scope,el);dst.appendChild(el);
  }
}
function instantiate(name,props,root){const c=C[name];const inst=new c.Logic(props);if(root)inst.__root=true;
  const frag=document.createDocumentFragment();renderChildren(c.tpl.content,inst.renderVals(),frag);return frag;}
let rootInst=null;
function mount(){const el=document.getElementById('root');
  if(!rootInst){const c=C.Main;rootInst=new c.Logic({});rootInst.__root=true;}
  const frag=document.createDocumentFragment();renderChildren(C.Main.tpl.content,rootInst.renderVals(),frag);
  el.replaceChildren(frag);}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault();});

C["Main"]={tpl:(function(){const t=document.createElement("template");t.innerHTML="\n\n<div style=\"width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #E9ECF1; font-family: 'Figtree', system-ui, sans-serif; color: #17212F; overflow: hidden\">\n\n  <!-- Menu lateral: telas da simula\u00e7\u00e3o -->\n  <div style=\"width: 244px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D5DAE2; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6578\">Fundacred \u00b7 Beta-i</div>\n      <div style=\"font-size: 20px; font-weight: 700; line-height: 1.2\">Beta-i Marketing</div>\n      <div style=\"font-size: 13px; color: #5A6578; line-height: 1.4\">Passo a passo das mudan\u00e7as sobre os sistemas existentes</div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div>\n          <sc-if value=\"{{ s.ready }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onClick=\"{{ s.pick }}\" style=\"display: flex; flex-direction: column; gap: 8px; width: 100%; box-sizing: border-box; padding: 8px; background: {{ s.bg }}; border: 2px solid {{ s.border }}; border-radius: 10px; cursor: pointer; text-align: left; color: inherit\">\n              <div style=\"position: relative; width: 184px; height: 90px; overflow: hidden; border: 1px solid #D5DAE2; border-radius: 4px; background: #FFFFFF\">\n                <div style=\"width: 1440px; height: 704px; transform: scale(0.1278); transform-origin: top left; pointer-events: none\">\n                  <sc-if value=\"{{ s.isBeta }}\" hint-placeholder-val=\"{{ true }}\">\n                    <dc-import name=\"BetaiTela\" show-marketing=\"{{ s.showMarketing }}\" annotate=\"{{ s.annotate }}\" page=\"{{ s.page }}\" modal=\"{{ s.modal }}\" hint-size=\"1440px,704px\"></dc-import>\n                  </sc-if>\n                </div>\n              </div>\n              <div style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; background: #17212F; color: #FFFFFF; font-size: 12px; font-weight: 700\">{{ s.n }}</span>\n                <span style=\"font-size: 14px; font-weight: 600; line-height: 1.25\">{{ s.title }}</span>\n              </div>\n            </button>\n          </sc-if>\n          <sc-if value=\"{{ s.pending }}\" hint-placeholder-val=\"{{ false }}\">\n            <button disabled aria-disabled=\"true\" style=\"display: flex; flex-direction: column; gap: 8px; width: 100%; box-sizing: border-box; padding: 8px; background: transparent; border: 2px dashed #C3CAD5; border-radius: 10px; cursor: default; text-align: left; color: #5A6578\">\n              <div style=\"width: 184px; height: 90px; box-sizing: border-box; border: 1px dashed #C3CAD5; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500\">A construir</div>\n              <div style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; background: #C3CAD5; color: #FFFFFF; font-size: 12px; font-weight: 700\">{{ s.n }}</span>\n                <span style=\"font-size: 14px; font-weight: 600; line-height: 1.25\">{{ s.title }}</span>\n              </div>\n            </button>\n          </sc-if>\n        </div>\n      </sc-for>\n    </div>\n  </div>\n\n  <!-- Palco: tela selecionada -->\n  <div style=\"flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 28px 24px; display: flex; flex-direction: column; justify-content: center; gap: 16px\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6578\">Tela {{ cur.n }} de 5</div>\n      <h1 style=\"margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2\">{{ cur.title }}</h1>\n      <div style=\"font-size: 15px; color: #3B475A; line-height: 1.45; max-width: 860px\">{{ cur.desc }}</div>\n    </div>\n\n    <div style=\"width: 1123px; height: 549px; flex-shrink: 0; position: relative; overflow-x: hidden; overflow-y: auto; background: #FFFFFF; border: 1px solid #C9CFD9; border-radius: 8px; box-shadow: 0 6px 24px rgba(23,33,47,0.12)\">\n      <div style=\"width: 1440px; zoom: 0.78\">\n        <sc-if value=\"{{ isTela1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <dc-import name=\"BetaiTela\" show-marketing=\"{{ false }}\" annotate=\"{{ false }}\" hint-size=\"1440px,704px\"></dc-import>\n        </sc-if>\n        <sc-if value=\"{{ isTela2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <dc-import name=\"BetaiTela\" show-marketing=\"{{ true }}\" annotate=\"{{ true }}\" hint-size=\"1440px,704px\"></dc-import>\n        </sc-if>\n        <sc-if value=\"{{ isTela3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <dc-import name=\"BetaiTela\" show-marketing=\"{{ true }}\" annotate=\"{{ true }}\" page=\"marketing\" on-access=\"{{ goAccess }}\" hint-size=\"1440px,704px\"></dc-import>\n        </sc-if>\n        <sc-if value=\"{{ isTela4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <dc-import name=\"BetaiTela\" show-marketing=\"{{ true }}\" annotate=\"{{ true }}\" page=\"modulo\" hint-size=\"1440px,704px\"></dc-import>\n        </sc-if>\n        <sc-if value=\"{{ isTela5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <dc-import name=\"BetaiTela\" show-marketing=\"{{ true }}\" annotate=\"{{ true }}\" page=\"modulo-interno\" hint-size=\"1440px,704px\"></dc-import>\n        </sc-if>\n      </div>\n    </div>\n\n  </div>\n\n</div>\n";return t;})(),Logic:(function(){
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { current: 1 };
  }
  renderVals() {
    const cur = this.state.current;
    const defs = [
      { n: 1, title: 'Beta-i hoje', ready: true, showMarketing: false, annotate: false,
        desc: 'Ponto de partida: o Beta-i como está hoje, sem nenhuma alteração. Serve de referência para as próximas telas.',
        notes: [] },
      { n: 2, title: 'Novo menu "Marketing"', ready: true, showMarketing: true, annotate: true,
        desc: 'O canal Beta-i ganha um novo item no menu principal. É a porta de entrada para o módulo de Marketing.',
        notes: [{ n: 1, text: 'Novo item "Marketing" no menu principal, à direita de "Satisfação". O restante da tela permanece igual.' }] },
      { n: 3, title: 'Landing do módulo', ready: true, showMarketing: true, annotate: true, page: 'marketing',
        desc: 'Ao clicar em "Marketing", abre uma landing page única, com rolagem: vídeo demo, duas saídas claras (Tenho interesse e Meu acesso), benefícios e contato com o time de negócios na mesma página, sem modal. Role a tela para ver tudo.',
        notes: [
          { n: 1, text: 'Embed do YouTube com o vídeo demo do Beta-i.' },
          { n: 2, text: 'Quero saber mais: contato direto com a área comercial. A negociação ocorrerá em conversa individual.' },
          { n: 3, text: 'Meu acesso: acesso ao módulo de Marketing. Esse mesmo CTA está localizado no topo.' }
        ] },
      { n: 4, title: 'Módulo embedado: login', ready: true, showMarketing: true, annotate: true, page: 'modulo',
        desc: 'O CTA "Meu acesso" carrega o módulo dentro do Beta-i, na área de conteúdo, com o menu e o cabeçalho do Beta-i ao redor. Sem SSO, o usuário faz o login do módulo ali mesmo.',
        notes: [{ n: 1, text: 'Módulo embedado na área de conteúdo.' }, { n: 2, text: 'Login próprio do módulo Marketing. Após validação, sistema reconhecerá a IE correspondente.' }] },
      { n: 5, title: 'Módulo embedado: pós-login', ready: true, showMarketing: true, annotate: true, page: 'modulo-interno',
        desc: 'Depois do login, o módulo segue embedado no Beta-i. O logotipo do Beta-i fica só no cabeçalho do Beta-i, e a logo da IE entra acima do título da página.',
        notes: [{ n: 1, text: 'Módulo embedado na área de conteúdo.' }, { n: 2, text: 'Whitelabel: logo da IE acima do título da página.' }] }
    ];
    const screens = defs.map((d) => ({
      n: d.n,
      title: d.title,
      ready: d.ready,
      pending: !d.ready,
      page: d.page || 'inicio',
      modal: d.modal === true,
      isBeta: d.modulo !== true && d.interno !== true,
      isModulo: d.modulo === true,
      isInterno: d.interno === true,
      showMarketing: d.showMarketing === true,
      annotate: d.annotate === true,
      bg: d.n === cur ? '#EAF1FD' : '#FFFFFF',
      border: d.n === cur ? '#1456C8' : '#E1E5EB',
      pick: () => { if (d.ready) this.setState({ current: d.n }); }
    }));
    const c = defs.find((d) => d.n === cur) || defs[0];
    return {
      goAccess: () => this.setState({ current: 4 }),
      screens,
      cur: { n: c.n, title: c.title, desc: c.desc, notes: c.notes || [], hasNotes: (c.notes || []).length > 0 },
      isTela1: cur === 1,
      isTela2: cur === 2,
      isTela3: cur === 3,
      isTela4: cur === 4,
      isTela5: cur === 5
    };
  }
}

return Component;})()};
